name: pages

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "tools/fetch_webui.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

# Let a queued run wait for the one in flight rather than cancelling it, so a
# deployment is never left half-published.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # The shared stylesheet is a release asset of colonization-re/web-ui, not
      # a file in this repository: `docs/_config.yml` pins the version and this
      # fetches it. If it fails, the build fails here rather than deploying a
      # site with no stylesheet.
      - name: Fetch the pinned web-ui stylesheet
        run: python3 tools/fetch_webui.py
      # The site is `docs/_layouts/default.html` over `docs/assets/col.css`; the
      # only plugins `docs/_config.yml` names come with the github-pages gem
      # set this action builds against, so it renders exactly as the
      # branch-and-folder setting rendered it.
      - uses: actions/jekyll-build-pages@v1
        with:
          source: ./docs
          destination: ./_site
      - uses: actions/upload-pages-artifact@v3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
